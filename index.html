<head>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 18px;
            min-height: 100vh;

            background:
                radial-gradient(circle at top, #fffdf4 0%, #ffffff 55%);

            color: #000060;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 620px;

            background: #fffbe6;

            border: 1px solid rgba(0, 0, 96, 0.06);
            border-radius: 18px;

            padding: 34px 22px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.07);

            opacity: 0;
            transform: translateY(18px) scale(0.985);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.3s ease;
        }

        .container.loaded {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .container:hover {
            box-shadow:
                0 14px 42px rgba(0, 0, 0, 0.09);
        }

        /* HEADSHOT */

        .headshot-link {
            display: inline-block;
            border-radius: 50%;
        }

        .headshot {
            width: 118px;
            height: 118px;

            border-radius: 50%;
            object-fit: cover;

            margin-bottom: 12px;

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.12);

            opacity: 0;
            transform: translateY(-12px) scale(0.9);

            transition:
                opacity 0.7s ease,
                transform 0.7s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.3s ease;
        }

        .headshot.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .headshot:hover {
            transform: scale(1.055);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.16);
        }

        /* NAME */

        .name {
            margin: 4px 0 24px;

            font-size: 35px;
            font-weight: 700;
            letter-spacing: -0.8px;

            color: #000060;

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease;
        }

        .name.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ICON BUTTONS */

        .icon-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            gap: 12px;

            margin: 0 auto 24px;
        }

        .icon-button {
            width: 50px;
            height: 50px;

            border-radius: 14px;

            background: rgba(255,255,255,0.92);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.07);

            border: 1px solid rgba(0, 0, 96, 0.05);

            opacity: 0;
            transform: translateY(18px) scale(0.85);

            transition:
                opacity 0.45s ease,
                transform 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease;

            will-change: transform;
        }

        .icon-button.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .icon-button:hover {
            box-shadow:
                0 9px 22px rgba(0, 0, 0, 0.13);

            background: #ffffff;
        }

        .icon-button img {
            width: 26px;
            height: 26px;

            object-fit: contain;

            pointer-events: none;

            transition: transform 0.25s ease;
        }

        .icon-button:hover img {
            transform: scale(1.08);
        }

        .icon-button.clicked {
            animation: clickPulse 0.35s ease;
        }

        @keyframes clickPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.88);
            }

            100% {
                transform: scale(1);
            }
        }

        /* CONTENT SECTIONS */

        .section {
            margin-top: 27px;
            padding-top: 21px;

            border-top:
                1px solid rgba(0, 0, 96, 0.10);

            opacity: 0;
            transform: translateY(24px);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(.2,.8,.2,1);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            margin-bottom: 13px;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 0.2px;

            color: #555;
        }

        /* GOLD */

        .gold-widget {
            width: 100%;
            max-width: 430px;
            height: 320px;

            border: 0;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .gold-widget:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 25px rgba(0, 0, 0, 0.10);
        }

        /* MOBILE */

        @media screen and (max-width: 600px) {

            body {
                padding: 8px;
            }

            .container {
                padding: 27px 14px;
                border-radius: 14px;
            }

            .headshot {
                width: 104px;
                height: 104px;
            }

            .name {
                font-size: 30px;
            }

            .icon-buttons {
                gap: 9px;
            }

            .icon-button {
                width: 46px;
                height: 46px;
                border-radius: 12px;
            }

            .icon-button img {
                width: 24px;
                height: 24px;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const container = document.getElementById("mainContainer");
    const headshot = document.getElementById("headshot");
    const name = document.getElementById("name");
    const buttons = document.querySelectorAll(".icon-button");
    const sections = document.querySelectorAll(".section");


    /* -------------------------
       PAGE ENTRANCE
    ------------------------- */

    requestAnimationFrame(() => {
        container.classList.add("loaded");
    });


    setTimeout(() => {
        headshot.classList.add("show");
    }, 180);


    setTimeout(() => {
        name.classList.add("show");
    }, 330);


    /* -------------------------
       STAGGER ICON BUTTONS
    ------------------------- */

    buttons.forEach((button, index) => {

        setTimeout(() => {
            button.classList.add("show");
        }, 450 + (index * 85));

    });


    /* -------------------------
       FLOATING HEADSHOT
    ------------------------- */

    let floatPosition = 0;
    let floatDirection = 1;

    function floatHeadshot() {

        floatPosition += 0.015 * floatDirection;

        if (floatPosition > 1) {
            floatDirection = -1;
        }

        if (floatPosition < -1) {
            floatDirection = 1;
        }

        if (
            !headshot.matches(":hover") &&
            headshot.classList.contains("show")
        ) {

            headshot.style.translate =
                `0 ${floatPosition * 2}px`;

        }

        requestAnimationFrame(floatHeadshot);
    }

    floatHeadshot();


    /* -------------------------
       BUTTON MOUSE TILT
    ------------------------- */

    buttons.forEach(button => {

        button.addEventListener("mousemove", function (event) {

            const rect = button.getBoundingClientRect();

            const x =
                event.clientX -
                rect.left -
                rect.width / 2;

            const y =
                event.clientY -
                rect.top -
                rect.height / 2;

            const rotateX =
                -(y / rect.height) * 10;

            const rotateY =
                (x / rect.width) * 10;

            button.style.transform =
                `translateY(-4px)
                 perspective(400px)
                 rotateX(${rotateX}deg)
                 rotateY(${rotateY}deg)
                 scale(1.05)`;

        });


        button.addEventListener("mouseleave", function () {

            button.style.transform =
                "translateY(0) rotateX(0) rotateY(0) scale(1)";

        });


        /* CLICK EFFECT */

        button.addEventListener("click", function () {

            button.classList.remove("clicked");

            void button.offsetWidth;

            button.classList.add("clicked");

        });

    });


    /* -------------------------
       SECTION SCROLL REVEAL
    ------------------------- */

    const observer = new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");

                    observer.unobserve(entry.target);
                }

            });

        },
        {
            threshold: 0.12
        }
    );


    sections.forEach(section => {
        observer.observe(section);
    });

});
</script>
