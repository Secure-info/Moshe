<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moshe Aziz</title>

    <meta
        name="description"
        content="Moshe Aziz — entrepreneur and founder of Jewelers Truly."
    >

    <link rel="icon" type="image/png" href="YourNameHeadshot2.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 18px;
            min-height: 100vh;

            background: #ffffff;
            color: #000060;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 620px;

            background: #fffbe6;
            border-radius: 16px;

            padding: 32px 22px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07);

            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .headshot {
            width: 118px;
            height: 118px;

            border-radius: 50%;
            object-fit: cover;

            margin-bottom: 12px;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .headshot:hover {
            transform: scale(1.03);
            opacity: 0.92;
        }

        .name {
            margin: 4px 0 24px;

            font-size: 34px;
            font-weight: 700;

            color: #000060;
        }

        /* ICON BUTTONS */

        .icon-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            gap: 12px;

            margin: 0 auto 24px;
        }

        .icon-button {
            width: 48px;
            height: 48px;

            border-radius: 12px;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .icon-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.12);

            background: #fffdf5;
        }

        .icon-button img {
            width: 26px;
            height: 26px;

            object-fit: contain;
        }

        /* JEWELERS TRULY */

        .jewelers-section {
            margin: 24px 0 8px;
            padding-top: 20px;

            border-top: 1px solid rgba(0, 0, 96, 0.10);
        }

        .jewelers-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            color: #777;
            font-size: 13px;

            text-decoration: none;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .jewelers-link:hover {
            color: #000060;
            transform: translateY(-1px);
        }

        .jewelers-logo {
            width: 34px;
            max-height: 24px;
            object-fit: contain;
            opacity: 0.65;
        }

        /* CONTENT SECTIONS */

        .section {
            margin-top: 26px;
            padding-top: 20px;

            border-top: 1px solid rgba(0, 0, 96, 0.10);
        }

        .section-title {
            margin-bottom: 12px;

            font-size: 14px;
            font-weight: 600;

            color: #555;
        }

        .gold-widget {
            width: 100%;
            max-width: 430px;
            height: 320px;

            border: 0;
            border-radius: 10px;

            background: #ffffff;
        }

        @media screen and (max-width: 600px) {

            body {
                padding: 8px;
            }

            .container {
                padding: 26px 14px;
                border-radius: 12px;
            }

            .headshot {
                width: 104px;
                height: 104px;
            }

            .name {
                font-size: 30px;
            }

            .icon-buttons {
                gap: 10px;
            }

            .icon-button {
                width: 46px;
                height: 46px;
            }

            .icon-button img {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>

<body>

        <!-- JEWELERS TRULY SUBTLE BRANDING -->

        <div class="jewelers-section">

            <a

                <img
                    src="Logo-7-8-24-TransparentJT.png"
                    alt="Jewelers Truly"

                <span>
                    Founder · Jewelers Truly

            </a>

        <!-- GIA -->

    </main>
